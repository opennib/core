name: Publish to npm

# Publishes @opennib/core when a GitHub release is published (tag `vX.Y.Z`).
# Uses npm trusted publishing (OIDC) with provenance, so the npm page shows a
# verified link back to this repository and the exact commit it was built from.
# Set this workflow as the package's trusted publisher on npmjs.com; no npm
# token is stored in the repo.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) needs npm 11.5+; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json is $pkg but the release tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
